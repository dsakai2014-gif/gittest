
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私の自己紹介ページ</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f0f4f8;
      color: #333;
      text-align: center;
    }

    header {
      background: #315b75;
      color: white;
      padding: 50px 20px;
    }

    h1 {
      font-size: 36px;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
    }

    button {
      background: #315b75;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #1d3d52;
    }
  </style>
</head>

<body>

  <header>
    <h1>こんにちは！</h1>
    <p>私のホームページへようこそ</p>
  </header>

  <main>
    <h2>自己紹介</h2>
    <p>こんにちは。私はホームページ制作を勉強しています。</p>
    <p>HTML・CSS・JavaScriptを使って、いろいろなものを作っています。</p>

    <h2>私の目標</h2>
    <p>自分だけのオリジナルサイトを作ること！</p>

    <button onclick="showMessage()">クリックしてね！</button>
  </main>

  <script>
    function showMessage() {
      alert("ボタンを押してくれてありがとう！");
    }
  </script>

</body>
</html>
